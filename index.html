<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1a1a18" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Chronicle</title>

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/ribbon.css">
  <link rel="stylesheet" href="css/week-view.css">
  <link rel="stylesheet" href="css/day-card.css">
  <link rel="stylesheet" href="css/expanded-day.css">
  <link rel="stylesheet" href="css/modals.css">
  <link rel="stylesheet" href="css/agenda.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/themes.css">
</head>
<body>

  <!-- SVG icon sprite (hidden) -->
  <div aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden">
    <!-- inlined at build time or loaded via JS; for dev we use the external file -->
  </div>

  <div class="app-wrapper" id="appWrapper">

    <!-- ── Ribbon ── -->
    <header class="ribbon" id="ribbon" role="banner">
      <div class="ribbon-left">
        <div class="ribbon-month" id="ribbonMonth" aria-live="polite"></div>
        <div class="ribbon-week"  id="ribbonWeek"  aria-live="polite"></div>
      </div>
      <div class="ribbon-right">
        <button class="icon-btn" id="btnToday"    aria-label="Go to today">
          <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#icon-today"/></svg>
        </button>
        <button class="icon-btn" id="btnJumpDate" aria-label="Jump to date">
          <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#icon-jump"/></svg>
        </button>
        <button class="icon-btn" id="btnSearch"   aria-label="Search">
          <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#icon-search"/></svg>
        </button>
        <button class="icon-btn" id="btnAgenda"   aria-label="Agenda">
          <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#icon-list"/></svg>
        </button>
        <button class="icon-btn" id="btnSync"     aria-label="Sync to Google Drive">
          <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#icon-sync"/></svg>
          <span class="sync-badge" id="syncBadge" hidden aria-label="Unsynced changes"></span>
        </button>
        <div class="ribbon-separator" role="separator" aria-hidden="true"></div>
        <button class="icon-btn icon-btn--add"      id="btnAdd"      aria-label="Add event">
          <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#icon-plus"/></svg>
        </button>
        <button class="icon-btn icon-btn--settings" id="btnSettings" aria-label="Settings">
          <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#icon-dots"/></svg>
        </button>
      </div>
    </header>

    <!-- ── Week container ── -->
    <main class="week-container" id="weekContainer" role="main">

      <!-- Previous month arrow (top) — click = prev month, swipe ◄► = prev/next week -->
      <div class="nav-arrow nav-arrow--top" id="navPrevWeek"
           role="button" tabindex="0" aria-label="Previous month">
        <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#icon-chevron-left"/></svg>
        <span>↓ Prev month</span>
        <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#icon-chevron-right"/></svg>
      </div>

      <!-- Grid + side arrows -->
      <div class="grid-with-sides">

        <div class="nav-arrow nav-arrow--left" id="navPrevMonth"
             role="button" tabindex="0" aria-label="Previous week">
          <span class="nav-v-hint nav-v-hint--top">↑</span>
          <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#icon-chevron-left"/></svg>
          <span class="rotated-text">Prev week</span>
          <span class="nav-v-hint nav-v-hint--bottom">↓</span>
        </div>

        <div class="week-grid" id="weekGrid" aria-label="Week view">
          <!-- Day cards rendered by app.js -->
        </div>

        <div class="nav-arrow nav-arrow--right" id="navNextMonth"
             role="button" tabindex="0" aria-label="Next week">
          <span class="nav-v-hint nav-v-hint--top">↑</span>
          <span class="rotated-text">Next week</span>
          <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#icon-chevron-right"/></svg>
          <span class="nav-v-hint nav-v-hint--bottom">↓</span>
        </div>

      </div>

      <!-- Next month arrow (bottom) — click = next month, swipe ◄► = prev/next week -->
      <div class="nav-arrow nav-arrow--bottom" id="navNextWeek"
           role="button" tabindex="0" aria-label="Next month">
        <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#icon-chevron-left"/></svg>
        <span>↑ Next month</span>
        <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#icon-chevron-right"/></svg>
      </div>

    </main>

  </div><!-- /.app-wrapper -->

  <!-- ── Agenda panel (slides in from right) ── -->
  <div class="agenda-panel" id="agendaPanel" aria-label="Agenda" role="complementary">
    <div class="agenda-header">
      <span class="agenda-title">Agenda</span>
      <button class="icon-btn" id="btnAgendaClose" aria-label="Close agenda">
        <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#icon-chevron-right"/></svg>
      </button>
    </div>
    <div class="agenda-filter-bar" id="agendaFilterBar">
      <button class="filter-pill active" data-filter="all">All</button>
      <button class="filter-pill" data-filter="event">Events</button>
      <button class="filter-pill" data-filter="todo">Todos</button>
    </div>
    <div class="agenda-list" id="agendaList"></div>
  </div>

  <!-- ── Conflict modal ── -->
  <div class="conflict-overlay" id="conflictModal">
    <div class="conflict-card">
      <div class="conflict-title">Sync conflict</div>
      <p class="conflict-body">Drive and local data differ. Which version do you want to keep?</p>
      <div class="conflict-times">
        <div class="conflict-time-row">
          <span class="conflict-time-label">Drive</span>
          <span class="conflict-time-val" id="conflictDriveTime"></span>
        </div>
        <div class="conflict-time-row">
          <span class="conflict-time-label">Local</span>
          <span class="conflict-time-val" id="conflictLocalTime"></span>
        </div>
      </div>
      <div class="conflict-actions">
        <button class="conflict-btn conflict-btn--secondary" id="conflictKeepLocal">Keep local</button>
        <button class="conflict-btn conflict-btn--primary"   id="conflictKeepDrive">Use Drive</button>
      </div>
    </div>
  </div>

  <script src="https://accounts.google.com/gsi/client" async defer onload="window._onGISLoad?.()"></script>
  <script type="module" src="js/app.js"></script>

</body>
</html>
